# All paths and hyperparameters live here. Any key can be overridden on the CLI.
data_dir: ../NEU-DET            # contains train/images/<class>/*.jpg and validation/images/<class>/*.jpg
splits_path: artifacts/splits.json
output_dir: artifacts

image_size: 200
val_frac: 0.15
test_frac: 0.15
seed: 42

batch_size: 32
epochs: 50
lr: 0.001
lr_scheduler: cosine            # cosine | none
weight_decay: 0.0001
num_workers: 0
device: auto                    # auto | cpu | cuda | mps

mlflow_tracking_uri: sqlite:///mlflow.db   # runs and metrics; artifacts go to ./mlruns
experiment_name: neu-defect-classification
